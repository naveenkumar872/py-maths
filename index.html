<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 3 Maths Lab</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
:root{
  --bg:#f7f6f2; --panel:#ffffff; --ink:#1d2430; --muted:#667085; --line:#e6e3dc; --soft:#f3f1ec;
  --acc:#0f766e; --acc-2:#115e59; --acc-bg:#e7f4f1; --acc-ink:#134e4a;
  --hl:#b45309; --hl-bg:#fdf3e1; --adv:#5b4b9a; --adv-bg:#efecf9;
  --ok:#15803d; --ok-bg:#e8f5ec; --bad:#b42318; --bad-bg:#fdecea;
  --code:#fbfaf7; --code-ink:#1f2937; --ran:#e7f4f1; --next:#fdf3e1;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Inter,"Segoe UI",system-ui,Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --fs:clamp(15px, calc(0.55vw + 8px), 19px);
  color-scheme:light;
}
body.big{--fs:clamp(18px, calc(0.7vw + 9px), 23px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.6;-webkit-font-smoothing:antialiased}
code{font-family:var(--mono);font-size:.88em;background:var(--soft);border:1px solid var(--line);padding:0 5px;border-radius:4px}
button{font:inherit;font-size:.86em;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:7px 14px;transition:border-color .15s,background .15s,box-shadow .15s;box-shadow:0 1px 0 rgba(16,24,40,.04)}
button:hover{border-color:#c9c4b8;background:#fcfbf9}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{background:var(--acc-2);border-color:var(--acc-2)}
button.sel{background:var(--acc-bg);border-color:var(--acc);color:var(--acc-ink)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
button.ghost:hover{color:var(--ink);background:var(--soft)}
button:disabled{opacity:.4;cursor:default}

/* layout */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:24px 14px}
.brand{padding:0 10px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .d{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:600}
.brand .n{font-family:var(--serif);font-size:1.22em;font-weight:600;color:var(--ink);line-height:1.3;margin-top:4px}
.brand .s{font-size:.8em;color:var(--muted);margin-top:4px}
.grp{font-size:.68em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 10px 8px}
.bar{height:4px;background:var(--soft);border-radius:2px;margin:0 10px 6px}
.bar div{height:4px;background:var(--acc);border-radius:2px;transition:width .4s}
.cnt{font-size:.74em;color:var(--muted);margin:0 10px 10px}
aside a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:.88em;cursor:pointer}
aside a:hover{background:var(--soft)}
aside a.on{background:var(--acc-bg);color:var(--acc-ink);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
aside a.off{color:#98a2b3;cursor:default}
aside a.off:hover{background:none}
aside .star{margin-left:auto;font-size:.75em;color:var(--hl)}
.ck{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.7em;flex:none;color:var(--muted);background:var(--panel)}
aside a.on .ck{border-color:var(--acc);color:var(--acc-ink)}
.ck.done{background:var(--acc);border-color:var(--acc);color:#fff !important}
.side-foot{margin-top:22px;padding:14px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-foot button{text-align:left}
.side-foot .st{font-size:.75em;color:var(--muted)}

main{padding:26px clamp(20px, 2.6vw, 52px) 48px;width:100%;min-width:0}
.crumb{font-size:.78em;color:var(--muted);letter-spacing:.02em}
h1.lt{font-family:var(--serif);font-weight:600;font-size:2em;margin:4px 0 2px;line-height:1.2}
.ls{color:var(--muted);margin:0 0 20px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--muted);font-size:.9em;display:flex;align-items:center;gap:8px;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--acc-ink);border-bottom-color:var(--acc)}
.tabs .tn{width:20px;height:20px;border-radius:50%;border:1px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:.72em}
.tabs .tn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.pane{display:none}
.pane.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:16px}
.card h3{font-family:var(--serif);font-weight:600;font-size:1.25em;margin:0 0 6px}
.intro{color:var(--muted);font-size:.92em;margin:0 0 14px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
.lv{display:inline-block;font-size:.68em;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:20px;vertical-align:middle}
.lv.b{background:var(--acc-bg);color:var(--acc-ink)}
.lv.a{background:var(--adv-bg);color:var(--adv)}
.lv.r{background:var(--hl-bg);color:var(--hl)}

/* slides */
.deck{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.slide{min-height:max(500px, calc(100vh - 300px));padding:clamp(28px, 3vw, 52px) clamp(28px, 4vw, 72px) 48px;display:flex;flex-direction:column;position:relative}
.slide .top{display:flex;align-items:center;gap:10px}
.slide .kick{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.slide.adv .kick{color:var(--adv)}
.slide.adv{box-shadow:inset 4px 0 0 var(--adv)}
.slide.real{box-shadow:inset 4px 0 0 var(--hl)}
.slide h2{font-family:var(--serif);font-weight:600;font-size:2em;line-height:1.2;margin:6px 0 20px}
.slide .body{flex:1;font-size:1.12em;display:flex;flex-direction:column;justify-content:center;padding-bottom:12px}
.slide p{margin:0 0 12px}
.slide ul{margin:0 0 12px;padding-left:22px}
.slide li{margin:4px 0}
.slide .big{font-size:1.2em;line-height:1.45}
.slide .pn{position:absolute;right:24px;bottom:14px;font-size:.75em;color:var(--muted)}
.slide .body > *{animation:rise .45s ease both}
.slide .body > *:nth-child(2){animation-delay:.08s}
.slide .body > *:nth-child(3){animation-delay:.16s}
.slide .body > *:nth-child(4){animation-delay:.24s}
.slide .body > *:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.deckbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--soft)}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
.dots span.a{background:#cfc8e8}
.dots span.r{background:#ecd3a3}
.dots span.on{background:var(--acc);width:22px;border-radius:5px}
.notes{display:none;margin-top:14px;padding:12px 16px;border-left:3px solid var(--hl);background:var(--hl-bg);font-size:.9em}
body.teacher .notes{display:block}
.deck:fullscreen{border:0;border-radius:0;display:flex;flex-direction:column;background:var(--panel)}
.deck:fullscreen .slide{min-height:0;overflow:auto;flex:1;padding:5vh 7vw 4vh;font-size:1.45vw}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:1150px){.cols{grid-template-columns:minmax(0,1fr);gap:8px}}
.lab{font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
table.t{border-collapse:collapse;width:100%;font-size:.92em}
table.t th{text-align:left;font-weight:600;font-size:.8em;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 12px}
table.t td{border-bottom:1px solid var(--line);padding:8px 12px;vertical-align:top}
pre.cb{background:var(--code);color:var(--code-ink);font-family:var(--mono);font-size:.86em;line-height:1.6;padding:12px 16px;border-radius:8px;margin:0 0 12px;white-space:pre;overflow:auto;border:1px solid var(--line)}
.note{padding:10px 14px;border-radius:8px;font-size:.92em;margin:10px 0;border-left:3px solid}
.note.k{background:var(--ok-bg);border-color:var(--ok)}
.note.m{background:var(--bad-bg);border-color:var(--bad)}
.note.d{background:var(--hl-bg);border-color:var(--hl)}
.note.a{background:var(--adv-bg);border-color:var(--adv)}
.note b{font-weight:600}
.boxes{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 12px}
.bx{display:flex;flex-direction:column;align-items:center}
.bx .v{min-width:50px;height:42px;padding:0 8px;border:1.5px solid var(--acc);background:var(--acc-bg);color:var(--acc-ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600}
.bx.h .v{border-color:var(--hl);background:var(--hl-bg);color:var(--ink)}
.bx .i{font-size:.72em;color:var(--muted);font-family:var(--mono);line-height:1.35}
.bx .i.n{color:var(--hl)}
.grid{display:inline-flex;flex-direction:column;gap:5px;margin:6px 0 12px;padding:8px 10px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:6px}
.grid .gr{display:flex;gap:5px;align-items:center}
.grid .gi{font-size:.7em;color:var(--muted);font-family:var(--mono);width:30px}
.grid .bx .v{min-width:44px;height:36px}
.anat{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--mono);font-size:1.05em;margin:10px 0 18px}
.anat span{display:flex;flex-direction:column;align-items:center;padding:6px 8px;border-radius:6px;background:var(--code);border:1px solid var(--line)}
.anat small{font-family:var(--sans);font-size:.6em;color:var(--muted);margin-top:4px}
.anat span.e{background:var(--acc-bg);border-color:var(--acc)}
.anat span.c{background:var(--hl-bg);border-color:var(--hl)}

/* animation scenes */
.anim{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:12px 16px 14px}
.ahead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ahead .atitle{font-weight:600;font-size:.9em}
.ahead button{margin-left:auto;padding:4px 12px;font-size:.8em}
.acode{white-space:pre-wrap;font-family:var(--mono);font-size:.92em;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;min-height:34px;transition:background .3s}
.acode.flash{background:var(--hl-bg)}
.swrap{overflow-x:auto;overflow-y:hidden;margin-top:6px}
.slab{font-size:.68em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:8px}
.stage{position:relative;margin:0 4px}
.abox{position:absolute;left:0;height:44px;border:1.5px solid var(--acc);background:var(--acc-bg);color:var(--acc-ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:.9em;transition:transform .55s cubic-bezier(.3,.7,.3,1),opacity .45s,background .3s,border-color .3s,color .3s}
.abox .lbl{position:absolute;bottom:calc(100% + 3px);font-family:var(--sans);font-weight:500;font-size:.7em;color:var(--muted);white-space:nowrap}
.abox .ix{position:absolute;top:calc(100% + 3px);font-size:.72em;color:var(--muted);font-weight:400;text-align:center;line-height:1.3;white-space:nowrap}
.abox .ix .n{color:var(--hl)}
.abox.hl{border-color:var(--hl);background:var(--hl-bg);color:var(--ink)}
.abox.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.abox.dim{opacity:.3 !important}
.abox.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.aptr{position:absolute;left:0;width:0;transition:transform .55s cubic-bezier(.3,.7,.3,1),opacity .3s}
.aptr div{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;white-space:nowrap;font-family:var(--mono);font-size:.82em;color:var(--hl)}
.aptr div span{font-size:1.1em;line-height:1}
.aptr.bad div{color:var(--bad)}
.astats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.astats:empty{display:none}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 12px;font-size:.82em;transition:background .3s}
.stat b{font-family:var(--mono);font-size:1.15em;margin-left:6px}
.stat.flash{background:var(--hl-bg)}
.acap{margin-top:10px;font-size:.95em;min-height:1.6em}

/* editor & output */
textarea.ed{width:100%;font-family:var(--mono);font-size:.9em;line-height:1.6;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--code);color:var(--code-ink);resize:vertical;tab-size:4;white-space:pre;overflow-wrap:normal;overflow-x:auto}
textarea.ed:focus{outline:2px solid var(--acc-bg);border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.out{font-family:var(--mono);font-size:.88em;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:12px}
.out:empty{display:none}
.out .h{display:block;font-family:var(--sans);font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
.ok{color:var(--ok)} .bad{color:var(--bad)} .muted{color:var(--muted)}
.task{background:var(--soft);border-radius:8px;padding:12px 16px;margin-bottom:12px}
.task ol{margin:6px 0 0;padding-left:22px}
.err{color:var(--bad);font-size:.85em}



/* sidebar accordion */
aside button.sec{display:grid;grid-template-columns:28px minmax(0,1fr) 16px;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 10px 12px;margin:4px 0 2px;box-shadow:none;position:relative;cursor:pointer}
aside button.sec:hover{background:var(--soft);border-color:transparent}
aside button.sec.open{background:var(--soft)}
aside .snum{width:28px;height:28px;border-radius:7px;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:600;color:var(--muted)}
aside button.sec.here .snum,aside button.sec.open .snum{background:var(--acc);border-color:var(--acc);color:#fff}
aside .stx{display:flex;flex-direction:column;min-width:0}
aside .sti{font-weight:600;font-size:.92em;color:var(--ink);line-height:1.3}
aside .ssub{font-size:.74em;color:var(--muted);font-weight:400}
aside .chev{color:var(--muted);font-size:1.2em;transition:transform .2s;justify-self:end}
aside button.sec.open .chev{transform:rotate(90deg)}
aside .sbar{position:absolute;left:48px;right:12px;bottom:5px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
aside .sbar i{display:block;height:3px;background:var(--acc)}
aside .slist{margin:2px 0 8px 14px;padding-left:10px;border-left:1px solid var(--line)}
aside .slist[hidden]{display:none}
aside a.sumlink{margin-top:10px;border-top:1px solid var(--line);border-radius:0;padding-top:14px}
aside a.sumlink.on{border-radius:7px}

/* cover page */
aside a.brand{display:block;color:inherit;text-decoration:none;cursor:pointer;padding:0 10px 18px;border-radius:0}
aside a.brand:hover{background:none}
aside a.brand:hover .n{color:var(--acc-ink)}
aside .slogo{display:block;width:100%;max-width:236px;height:auto;margin:0 auto 14px}
.cover{min-height:calc(100vh - 88px);display:flex;align-items:center;justify-content:center}
.hero{width:100%;max-width:1180px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px rgba(16,24,40,.06);text-align:center}
.hero .band{background:#fff;padding:26px 24px 22px;border-bottom:1px solid var(--line)}
.hero .logo{display:block;width:391px;max-width:100%;height:auto;margin:0 auto}
.hero .body{padding:30px 40px 34px;border-top:4px solid var(--acc)}
.hero .prog{font-size:.74em;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:600;margin:0}
.hero .prog2{font-size:.95em;color:var(--muted);margin:6px 0 20px}
.hero .daytag{display:inline-block;background:var(--acc);color:#fff;font-weight:600;font-size:.8em;letter-spacing:.1em;padding:5px 16px;border-radius:20px;margin-bottom:14px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:2.9em;line-height:1.15;margin:0 0 10px}
.hero .lead{margin:0 auto;color:var(--muted);font-size:1.05em;max-width:560px}
.hero .rp{display:flex;align-items:center;justify-content:center;gap:14px;margin:28px auto 0;padding-top:24px;border-top:1px solid var(--line);text-align:left}
.hero .av{width:48px;height:48px;border-radius:50%;background:var(--acc-bg);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-family:var(--serif);font-size:1.1em;flex:none}
.hero .rp b{display:block;font-size:1.08em}
.hero .rp span{font-size:.86em;color:var(--muted)}
.hero .go{margin-top:24px;padding:11px 26px;font-size:.95em}
@media (max-width:900px){.cover{min-height:0}.hero .body{padding:24px 20px 28px}.hero h1{font-size:1.9em}}

/* numbered item selector */
.qnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.qnav button{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:24px;border:1px solid var(--line);background:var(--panel);font-weight:500;box-shadow:none}
.qnav button:hover{border-color:var(--acc);background:var(--panel)}
.qnav .qn{width:28px;height:28px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.85em;font-weight:600;color:var(--muted)}
.qnav .qt{font-size:.95em;color:var(--ink)}
.qnav button.on{background:var(--acc-bg);border-color:var(--acc)}
.qnav button.on .qn{background:var(--acc);border-color:var(--acc);color:#fff}
.qnav button.on .qt{color:var(--acc-ink)}
.qnav button.done .qn{background:var(--ok);border-color:var(--ok);color:#fff;font-size:0}
.qnav button.done .qn:after{content:"✓";font-size:13px}
.qitem[hidden]{display:none}
h3.qh{font-family:var(--serif);font-weight:600;font-size:1.2em;margin:4px 0 12px}

/* maths explanation boxes */
.mathbox{border:1px solid var(--line);border-left:4px solid var(--hl);background:var(--hl-bg);border-radius:0 10px 10px 0;padding:12px 16px;margin:0 0 14px}
.mathbox .mlab,.mathbox summary{font-size:.74em;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--hl)}
.mathbox p{margin:6px 0 0;font-size:1.02em;line-height:1.7}
details.mathbox summary{cursor:pointer;list-style:none}
details.mathbox summary::-webkit-details-marker{display:none}
details.mathbox summary:before{content:"▸ ";}
details.mathbox[open] summary:before{content:"▾ ";}
/* explain-the-maths panel (class names start with mh- so they never clash with KaTeX) */
.mh-btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.86em;font-weight:600;color:#92400e;background:#fdf3e1;border:1px solid #e9a21b;border-radius:999px;padding:7px 15px;cursor:pointer;white-space:nowrap}
.mh-btn:hover{background:#fbe6bf}
.slide{position:relative}
.mh-corner{position:absolute;top:18px;right:20px;z-index:2;box-shadow:0 2px 8px rgba(233,162,27,.25)}
.qhrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qhrow h3.qh{margin-bottom:8px}
.mh-scrim{position:fixed;inset:0;background:rgba(15,23,30,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.mh-panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);box-shadow:-10px 0 40px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .25s ease;z-index:90;overflow-y:auto;padding:0 26px 30px}
body.mh-open .mh-panel{transform:none}

/* ================= tracer ================= */
function valHTML(v){
  if (v.t === 'list' || v.t === 'tuple'){
    if (!v.items.length) return `<span class="sv">${v.t === 'list' ? '[ ]   empty list' : '( )'}</span>`;
    return boxes(v.items) + (v.n > 30 ? `<span class="muted">… ${v.n} items</span>` : '');
  }
  return `<span class="sv">${esc(v.r)}</span>`;
}
const valTxt = v => v.t === 'list' ? '[' + v.items.join(', ') + (v.n > 30 ? ', …' : '') + ']' : (v.t === 'tuple' ? '(' + v.items.join(', ') + ')' : v.r);
function varsHTML(after, before){
  const keys = Object.keys(after);
  if (!keys.length) return '<span class="muted" style="font-size:.88em">No variables yet</span>';
  return keys.map(k => {
    const chg = !before || !(k in before) || JSON.stringify(before[k]) !== JSON.stringify(after[k]);
    return `<div class="var${chg ? ' chg' : ''}"><div class="nm">${esc(k)}</div><div>${valHTML(after[k])}</div></div>`;
  }).join('');
}
function explain(code, ln, before, after){
  const src = code.split('\n')[ln-1] || '';
  let h = `<div><b>Line ${ln} ran:</b> <code>${esc(src.trim())}</code></div>`;
  for (const k of Object.keys(after.g)){
    if (!(k in before.g)) h += `<div><span class="tag n">New</span><code>${esc(k)}</code> = ${esc(valTxt(after.g[k]))}</div>`;
    else if (JSON.stringify(before.g[k]) !== JSON.stringify(after.g[k])) h += `<div><span class="tag c">Changed</span><code>${esc(k)}</code>: ${esc(valTxt(before.g[k]))} → <b>${esc(valTxt(after.g[k]))}</b></div>`;
  }
  if (after.loc){
    const bl = (before.loc && before.loc.fn === after.loc.fn) ? before.loc.vars : {};
    for (const k of Object.keys(after.loc.vars)){
      if (!(k in bl)) h += `<div><span class="tag n">New</span>in ${esc(after.loc.fn)}(): <code>${esc(k)}</code> = ${esc(valTxt(after.loc.vars[k]))}</div>`;
      else if (JSON.stringify(bl[k]) !== JSON.stringify(after.loc.vars[k])) h += `<div><span class="tag c">Changed</span>in ${esc(after.loc.fn)}(): <code>${esc(k)}</code> → <b>${esc(valTxt(after.loc.vars[k]))}</b></div>`;
    }
  }
  const nw = after.out.slice(before.out.length);
  if (nw) h += `<div><span class="tag o">Printed</span><code>${esc(nw.replace(/\n$/,''))}</code></div>`;
  return h;
}
async function startTrace(box, code){
  box.innerHTML = '<div style="padding:12px" class="muted">Preparing the trace…</div>';
  let T;
  try { T = await traceCode(code); } catch(e){ box.innerHTML = `<div style="padding:12px" class="bad">${NOPY.error}</div>`; return; }
  if (!T.lines.length){ box.innerHTML = `<div style="padding:12px" class="bad">${esc(T.error || 'Nothing to trace.')}</div>`; return; }
  const lines = code.split('\n'), n = T.lines.length;
  box.innerHTML = `
    <div class="tbar">
      <button data-a="first" title="First step">|◀</button>
      <button data-a="prev">◀ Back</button>
      <button data-a="next" class="pri">Next ▶</button>
      <button data-a="last" title="Last step">▶|</button>
      <button data-a="play">Play</button>
      <input type="range" min="0" max="${n-1}" value="0" aria-label="Step">
      <span class="tstep"></span>
    </div>
    <div class="tgrid">
      <div class="tcode cm-s-lab">${hlHTML(code).split('\n').map((l,i) => `<div class="tl" data-l="${i+1}"><span class="ln">${i+1}</span><span>${l || ' '}</span></div>`).join('')}</div>
      <div class="tright">
        <div class="texpl"></div>
        <div><div class="tlab">Variables in memory</div><div class="tvars"></div></div>
        <div><div class="tlab">Output so far</div><div class="tout"></div></div>
      </div>
    </div>
    <div class="tleg"><span><span class="sw" style="background:var(--ran);border:1px solid var(--acc)"></span>Line that just ran</span><span><span class="sw" style="background:var(--next);border:1px solid var(--hl)"></span>Line that runs next</span><span><span class="sw" style="border:1px solid var(--hl);background:var(--hl-bg)"></span>Variable that just changed</span></div>`;
  const q = s => box.querySelector(s);
  let k = 0, timer = null;
  function draw(){
    const b = T.states[k], a = T.states[k+1], ln = T.lines[k], nx = T.lines[k+1];
    box.querySelectorAll('.tl').forEach(el => { const l = +el.dataset.l; el.className = 'tl' + (l === ln ? ' ran' : (l === nx ? ' nxt' : '')); });
    let ex = explain(code, ln, b, a);
    if (k === n-1) ex += T.error ? `<div class="bad"><b>Error:</b> ${esc(T.error)}</div>` : `<div class="ok"><b>Program finished.</b></div>`;
    q('.texpl').innerHTML = ex;
    let vh = varsHTML(a.g, b.g);
    if (a.loc) vh += `<div class="tlab" style="margin-top:10px">Inside ${esc(a.loc.fn)}()</div>` + varsHTML(a.loc.vars, b.loc && b.loc.fn === a.loc.fn ? b.loc.vars : {});
    q('.tvars').innerHTML = vh;
    q('.tout').textContent = a.out || '';
    q('.tstep').textContent = `Step ${k+1} of ${n}`;
    q('input[type=range]').value = k;
  }
  const stop = () => { if (timer){ clearInterval(timer); timer = null; q('[data-a=play]').textContent = 'Play'; } };
  q('.tbar').addEventListener('click', e => {
    const a = e.target.dataset && e.target.dataset.a; if (!a) return;
    if (a === 'play'){
      if (timer){ stop(); return; }
      if (k >= n-1) k = 0;
      e.target.textContent = 'Pause';
      timer = setInterval(() => { if (k >= n-1){ stop(); return; } k++; draw(); }, 900);
      draw(); return;
    }
    stop();
    k = a === 'first' ? 0 : a === 'prev' ? Math.max(0, k-1) : a === 'next' ? Math.min(n-1, k+1) : n-1;
    draw();
  });
  q('input[type=range]').addEventListener('input', e => { stop(); k = +e.target.value; draw(); });
  draw();
}

 real:{
  title:'Fitting a straight line by the method of least squares',
  ptitle:'The problem (university exam style)',
  story:`Fit a straight line y = a + bx to the following data by the method of least squares, and use it to estimate y when x = 5.
   <table class="t" style="margin:10px 0"><tr><th>x</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>y</th><td>1.0</td><td>1.8</td><td>3.3</td><td>4.5</td><td>6.3</td></tr></table>`,
  model:`<p>The normal equations for y = a + bx are</p>
   <p class="formula">Σy = na + bΣx &nbsp;&nbsp;&nbsp; Σxy = aΣx + bΣx²</p>
   <p>Solving them gives b = (nΣxy − ΣxΣy) ÷ (nΣx² − (Σx)²) and a = (Σy − bΣx) ÷ n.</p>
   <p>The data are two <b>lists of the same length</b>: x[i] and y[i] together are one observation. <code>len()</code> gives n, <code>sum()</code> gives Σx and Σy, and one loop over the positions builds Σx² and Σxy.</p>`,
  params:[{k:'x',label:'x values',def:'0, 1, 2, 3, 4',list:true,minCount:3,maxCount:50,min:-1000000,max:1000000},{k:'y',label:'y values (same number as x)',def:'1.0, 1.8, 3.3, 4.5, 6.3',list:true,same:'x',minCount:3,maxCount:50,min:-1000000,max:1000000}],
  code:v => `x = [${v.x.join(', ')}]
y = [${v.y.join(', ')}]
n = len(x)
Sx = sum(x)
Sy = sum(y)
Sxx = 0
Sxy = 0
for i in range(n):
    Sxx = Sxx + x[i] * x[i]
    Sxy = Sxy + x[i] * y[i]
b = (n * Sxy - Sx * Sy) / (n * Sxx - Sx ** 2)
a = (Sy - b * Sx) / n
print("n =", n, "  Sx =", round(Sx, 4), "  Sy =", round(Sy, 4))
print("Sx2 =", round(Sxx, 4), "  Sxy =", round(Sxy, 4))
print("Best-fit line: y =", round(a, 4), "+", round(b, 4), "x")
fitted = []
for i in range(n):
    fitted.append(round(a + b * x[i], 4))
print("Fitted values:", fitted)
print("Estimate at x = 5:", round(a + b * 5, 4))`,
  chart:{list:'y', labels:'x', lpre:'x = ', dp:2, label:'The list y: observed values at each x'},
 }

 real:{
  title:'Characteristic equation and eigenvalues of a 3 × 3 matrix',
  ptitle:'The problem (university exam style)',
  story:`Find the characteristic equation of the matrix A below and hence its eigenvalues. Verify that the sum of the eigenvalues equals the trace and that their product equals |A|.
   <div style="margin:10px 0">${grid([[8,-6,2],[-6,7,-4],[2,-4,3]])}</div>`,
  model:`<p>For a 3 × 3 matrix the characteristic equation is</p>
   <p class="formula">λ³ − S₁λ² + S₂λ − |A| = 0</p>
   <p>where S₁ = a₁₁ + a₂₂ + a₃₃ (the trace) and S₂ = sum of the minors of the diagonal elements. In Python the element aᵢⱼ is <code>A[i-1][j-1]</code>, so every minor is written directly from <b>indexes</b>: for example the minor of a₁₁ is <code>A[1][1]*A[2][2] - A[1][2]*A[2][1]</code>.</p>`,
  params:[{k:'m',label:'Matrix entries row by row (9 whole numbers)',def:'8, -6, 2, -6, 7, -4, 2, -4, 3',list:true,count:9,int:true,min:-50,max:50}],
  code:v => `A = [[${v.m.slice(0, 3).join(', ')}],
     [${v.m.slice(3, 6).join(', ')}],
     [${v.m.slice(6, 9).join(', ')}]]
S1 = A[0][0] + A[1][1] + A[2][2]                  # trace
M11 = A[1][1] * A[2][2] - A[1][2] * A[2][1]       # minor of a11
M22 = A[0][0] * A[2][2] - A[0][2] * A[2][0]       # minor of a22
M33 = A[0][0] * A[1][1] - A[0][1] * A[1][0]       # minor of a33
S2 = M11 + M22 + M33
det = (A[0][0] * M11
       - A[0][1] * (A[1][0] * A[2][2] - A[1][2] * A[2][0])
       + A[0][2] * (A[1][0] * A[2][1] - A[1][1] * A[2][0]))
coeffs = [1, -S1, S2, -det]
print("S1 =", S1, "  S2 =", S2, "  |A| =", det)
print("Coefficients of the characteristic equation:", coeffs)
roots = []
for lam in range(-20, 21):
    if lam ** 3 - S1 * lam ** 2 + S2 * lam - det == 0:
        roots.append(lam)
print("Integer eigenvalues between -20 and 20:", roots)
print("Sum of these =", sum(roots), "  Trace =", S1)`,
 }

    ['2( y₂ + y₄ + … + yₙ₋₂ )','even positions inside','<code>2 * sum(a[2:-1:2])</code>'],

 real:{
  title:'Which batching plant gives more consistent concrete?',
  ptitle:'The problem (university exam style)',
  story:`The compressive strengths (N/mm²) of 8 concrete cubes from each of two batching plants are given below. Find the mean, median, range and standard deviation for each plant. Which plant is more consistent?
   <table class="t" style="margin:10px 0"><tr><th>Plant A</th><td>25.2</td><td>26.8</td><td>24.5</td><td>27.1</td><td>25.9</td><td>26.3</td><td>24.8</td><td>26.0</td></tr>
   <tr><th>Plant B</th><td>23.5</td><td>28.9</td><td>25.1</td><td>29.4</td><td>22.8</td><td>27.6</td><td>24.2</td><td>26.9</td></tr></table>`,
  model:`<p>Consistency is compared with the <b>coefficient of variation</b>, because it measures spread relative to the mean:</p>
   <p class="formula">σ = √( Σ(x − x̄)² ÷ n ) &nbsp;&nbsp;&nbsp; CV = (σ ÷ x̄) × 100</p>
   <p>The plant with the <b>smaller CV</b> is more consistent. <code>sum</code>, <code>len</code>, <code>max</code>, <code>min</code> and <code>sorted</code> give the mean, range and median in one line each; one loop gives Σ(x − x̄)².</p>`,
  params:[{k:'a',label:'Plant A strengths',def:'25.2, 26.8, 24.5, 27.1, 25.9, 26.3, 24.8, 26.0',list:true,minCount:3,maxCount:50,min:0,max:1000},{k:'b',label:'Plant B strengths',def:'23.5, 28.9, 25.1, 29.4, 22.8, 27.6, 24.2, 26.9',list:true,minCount:3,maxCount:50,min:0.0001,max:1000}],
  code:v => `A = [${v.a.join(', ')}]
B = [${v.b.join(', ')}]
plants = ["Plant A", "Plant B"]
cv = []
for d in [A, B]:
    n = len(d)
    mean = sum(d) / n
    s = sorted(d)
    if n % 2 == 1:
        median = s[n // 2]
    else:
        median = (s[n // 2 - 1] + s[n // 2]) / 2
    sq = 0
    for v in d:
        sq = sq + (v - mean) ** 2
    sd = (sq / n) ** 0.5
    cv.append(round(sd / mean * 100, 2))
    print("mean =", round(mean, 4), " median =", round(median, 4), " range =", round(max(d) - min(d), 2), " SD =", round(sd, 4))
print("Coefficient of variation (%):", cv)
if cv[0] < cv[1]:
    print("Plant A is more consistent")
elif cv[1] < cv[0]:
    print("Plant B is more consistent")
else:
    print("Both plants are equally consistent")`,
  chart:{list:'cv', labels:'plants', suf:'%', dp:2, label:'The list cv: coefficient of variation of each plant (smaller is more consistent)'},
 }
},

  title:'Root of an equation by the Newton–Raphson method',
  ptitle:'The problem (university exam style)',
  story:'Find the positive real root of <b>x³ − 2x − 5 = 0</b> by the Newton–Raphson method, correct to four decimal places.',
  model:`<p>Since f(2) = −1 &lt; 0 and f(3) = 16 &gt; 0, a root lies in (2, 3). Take x₀ = 2. The iteration is</p>
   <p class="formula">x<sub>n+1</sub> = x<sub>n</sub> − f(x<sub>n</sub>) ÷ f′(x<sub>n</sub>), &nbsp;&nbsp; f(x) = x³ − 2x − 5, &nbsp; f′(x) = 3x² − 2</p>
   <p>Each new approximation is <b>appended</b> to a list, so the list is the iteration table students write in the exam. A second list keeps the change |x<sub>n+1</sub> − x<sub>n</sub>|, and the loop stops when the change is smaller than the tolerance.</p>`,
  params:[{k:'x0',label:'Initial approximation x₀',def:2,min:-100,max:100},{k:'tol',label:'Tolerance',def:0.00001,min:1e-12,max:0.1},{k:'it',label:'Maximum iterations (1 to 40)',def:20,min:1,max:40,int:true}],
  code:v => `x = ${v.x0}                  # initial approximation x0
tol = ${v.tol}           # stop when the change is smaller than this
approx = [x]
errors = []
for k in range(${v.it}):
    fx = x ** 3 - 2 * x - 5     # f(x)
    dfx = 3 * x ** 2 - 2        # f'(x)
    x_new = x - fx / dfx
    approx.append(round(x_new, 6))
    errors.append(abs(x_new - x))
    x = x_new
    if errors[-1] < tol:
        break
print("Approximations:", approx)
print("Iterations used:", len(approx) - 1)
print("Root correct to 4 decimal places:", round(x, 4))`,

 }
},

  model:`<p>Since f(1) = −1 &lt; 0 and f(2) = 5 &gt; 0, a root lies in (1, 2). At each step take the midpoint m = (a + b)/2 and keep the half where the sign changes:</p>

  title:'Lagrange\'s interpolation formula',
  ptitle:'The problem (university exam style)',
  story:`Using Lagrange's interpolation formula, find y(10) from the following table.
   <table class="t" style="margin:10px 0"><tr><th>x</th><td>5</td><td>6</td><td>9</td><td>11</td></tr><tr><th>y</th><td>12</td><td>13</td><td>14</td><td>16</td></tr></table>`,
  model:`<p>For unequally spaced points the interpolating polynomial is</p>
   <p class="formula">P(x) = Σ yᵢ Lᵢ(x), &nbsp;&nbsp; Lᵢ(x) = Π<sub>j ≠ i</sub> (x − xⱼ) ÷ (xᵢ − xⱼ)</p>
   <p>Two small functions do the work: <code>basis(i, x)</code> <b>returns</b> Lᵢ(x), and <code>P(x)</code> adds up the returned values times yᵢ. Because P returns a number, we can check it at every data point and evaluate it anywhere.</p>`,
  params:[{k:'X',label:'x values (all different)',def:'5, 6, 9, 11',list:true,distinct:true,minCount:2,maxCount:12,min:-1000000,max:1000000},{k:'Y',label:'y values (same number as x)',def:'12, 13, 14, 16',list:true,same:'X',minCount:2,maxCount:12,min:-1000000,max:1000000},{k:'xq',label:'Estimate y at x =',def:10,min:-1000000,max:1000000}],
  code:v => `X = [${v.X.join(', ')}]
Y = [${v.Y.join(', ')}]
x = ${v.xq}

def basis(i, x):
    L = 1
    for j in range(len(X)):
        if j != i:
            L = L * (x - X[j]) / (X[i] - X[j])
    return L

def P(x):
    total = 0
    for i in range(len(X)):
        total = total + basis(i, x) * Y[i]
    return total

print("Basis values L_i(x):", [round(basis(i, x), 4) for i in range(len(X))])
print("Check, P at the data points:", [round(P(t), 4) for t in X])
print("Estimated y at x =", x, ":", round(P(x), 4))`,

 }

  title:'Solving a system of equations by Cramer\'s rule',
  ptitle:'The problem (university exam style)',
  story:'Solve by Cramer\'s rule: <b>x + y + z = 6</b>, <b>2x + 3y − z = 5</b>, <b>6x − 2y − 3z = −7</b>.',
  model:`<p>With D = |A| and Dₓ, D_y, D_z the determinants with the column of constants in place of each column,</p>
   <p class="formula">x = Dₓ ÷ D, &nbsp; y = D_y ÷ D, &nbsp; z = D_z ÷ D &nbsp;&nbsp; (D ≠ 0)</p>
   <p><code>det3(M)</code> returns one determinant. <code>cramer(A, B)</code> calls it four times and <b>returns several values</b> at once, which are unpacked into D, Dx, Dy, Dz, x, y and z.</p>`,
  params:[{k:'A',label:'Coefficients, row by row (9 numbers)',def:'1, 1, 1, 2, 3, -1, 6, -2, -3',list:true,count:9,min:-1000,max:1000},{k:'B',label:'Constants (3 numbers)',def:'6, 5, -7',list:true,count:3,min:-1000000,max:1000000}],
  code:v => `def det3(M):
    return (M[0][0] * (M[1][1] * M[2][2] - M[1][2] * M[2][1])
            - M[0][1] * (M[1][0] * M[2][2] - M[1][2] * M[2][0])
            + M[0][2] * (M[1][0] * M[2][1] - M[1][1] * M[2][0]))

def replace_column(M, col, B):
    return [[B[i] if j == col else M[i][j] for j in range(3)] for i in range(3)]

def cramer(A, B):
    D = det3(A)
    if D == 0:
        return None
    Dx = det3(replace_column(A, 0, B))
    Dy = det3(replace_column(A, 1, B))
    Dz = det3(replace_column(A, 2, B))
    return D, Dx, Dy, Dz, Dx / D, Dy / D, Dz / D

A = [[${v.A.slice(0, 3).join(', ')}],
     [${v.A.slice(3, 6).join(', ')}],
     [${v.A.slice(6, 9).join(', ')}]]
B = [${v.B.join(', ')}]
result = cramer(A, B)
if result is None:
    print("D = 0: the system has no unique solution")
else:
    D, Dx, Dy, Dz, x, y, z = result
    print("D =", D, "  Dx =", Dx, "  Dy =", Dy, "  Dz =", Dz)
    print("x =", round(x, 4), "  y =", round(y, 4), "  z =", round(z, 4))
    print("Check, left-hand sides:", [round(A[i][0] * x + A[i][1] * y + A[i][2] * z, 4) for i in range(3)], " should be", B)`
 }

  story:'Evaluate <b>∫₀¹ dx / (1 + x²)</b> using Simpson\'s 1/3 rule with h = 1/6, and hence obtain an approximate value of π. Compare with the trapezoidal rule.',
  model:`<p>Since ∫₀¹ dx/(1 + x²) = tan⁻¹1 = π/4, the integral gives π = 4 × (the integral).</p>
   <p class="formula">∫ₐᵇ f dx ≈ (h/3)[ f(a) + f(b) + 4 Σ f(odd points) + 2 Σ f(even points) ]</p>
   <p><code>simpson(f, a, b, n)</code> and <code>trapezoidal(f, a, b, n)</code> each take the <b>function as an argument</b>. The same two functions answer every numerical-integration question in the syllabus.</p>`,

  code:v => `PI = 3.141592653589793       # reference value (the math module gives this in section 03)

def simpson(f, a, b, n):
    h = (b - a) / n
    total = f(a) + f(b)
    for i in range(1, n):
        if i % 2 == 1:
            total = total + 4 * f(a + i * h)
        else:
            total = total + 2 * f(a + i * h)
    return total * h / 3

def trapezoidal(f, a, b, n):
    h = (b - a) / n
    total = (f(a) + f(b)) / 2
    for i in range(1, n):
        total = total + f(a + i * h)
    return total * h

    return 1 / (1 + x * x)

  title:'Runge–Kutta method of fourth order',
  ptitle:'The problem (university exam style)',
  story:'Using the Runge–Kutta method of fourth order, find y(0.1) and y(0.2) for <b>dy/dx = x + y²</b>, y(0) = 1, taking h = 0.1.',
  model:`<p>For each step,</p>
   <p class="formula">k₁ = hf(x, y), &nbsp; k₂ = hf(x + h/2, y + k₁/2), &nbsp; k₃ = hf(x + h/2, y + k₂/2), &nbsp; k₄ = hf(x + h, y + k₃)<br>y<sub>new</sub> = y + (k₁ + 2k₂ + 2k₃ + k₄) ÷ 6</p>
   <p>The equation is a one-line <b>lambda</b>, <code>f = lambda x, y: x + y * y</code>, passed into a general <code>rk4(f, x0, y0, h, n)</code> that returns two lists. Inside rk4, k1 to k4 are <b>local</b> variables.</p>`,
  params:[{k:'h',label:'Step size h',def:0.1,min:0.001,max:0.5},{k:'n',label:'Number of steps n (1 to 20)',def:2,min:1,max:20,int:true}],
  code:v => `f = lambda x, y: x + y * y          # dy/dx = x + y^2

def rk4(f, x, y, h, n):
    xs = [x]
    ys = [y]
    for i in range(n):
        k1 = h * f(x, y)
        k2 = h * f(x + h / 2, y + k1 / 2)
        k3 = h * f(x + h / 2, y + k2 / 2)
        k4 = h * f(x + h, y + k3)
        y = y + (k1 + 2 * k2 + 2 * k3 + k4) / 6
        x = round(x + h, 10)
        xs.append(x)
        ys.append(round(y, 4))
    return xs, ys

xs, ys = rk4(f, 0, 1, ${v.h}, ${v.n})
print("x:", xs)
print("y:", ys)`,
  chart:{list:'ys', labels:'xs', lpre:'x = ', dp:4, label:'The list ys: the RK4 solution at each step'}
 }
}

    S = sum([1 / k ** 2 for k in range(1, N + 1)])
    errors.append(target - S)

  title:'Newton\'s law of cooling',

  story:'A body cools from <b>80 °C to 60 °C in 20 minutes</b> in surroundings kept at <b>20 °C</b>. Using Newton\'s law of cooling, find its temperature after 40 minutes and the time it takes to cool to 30 °C.',
  model:`<p>Newton's law dT/dt = −k(T − Tₛ) has the solution</p>
   <p class="formula">T(t) = Tₛ + (T₀ − Tₛ) e<sup>−kt</sup>, &nbsp;&nbsp; k = (1/t₁) ln[(T₀ − Tₛ) ÷ (T₁ − Tₛ)]</p>
   <p>and the time to reach a temperature T is t = (1/k) ln[(T₀ − Tₛ) ÷ (T − Tₛ)]. Python needs <code>math.log</code> (ln) to find k and the time, and <code>math.exp</code> for the temperature.</p>`,
  params:[{k:'Ts',label:'Surroundings Tₛ (°C)',def:20,min:-50,max:500},{k:'T0',label:'Initial T₀ (°C)',def:80,min:-50,max:2000},{k:'T1',label:'Temperature after t₁ (°C)',def:60,min:-50,max:2000},{k:'t1',label:'t₁ (minutes)',def:20,min:0.1,max:10000},{k:'Tq',label:'Find the time to reach (°C)',def:30,min:-50,max:2000}],
  code:v => `import math

Ts = ${v.Ts}      # temperature of the surroundings
T0 = ${v.T0}      # initial temperature
T1 = ${v.T1}      # temperature after t1 minutes
t1 = ${v.t1}
Tq = ${v.Tq}      # find when the body reaches this temperature
if not (T0 > T1 > Ts) or not (Ts < Tq < T0):
    print("Use T0 > T1 > Ts and Ts < Tq < T0 for a cooling body")
else:
    k = math.log((T0 - Ts) / (T1 - Ts)) / t1

    def T(t):
        return Ts + (T0 - Ts) * math.exp(-k * t)

    print("k =", round(k, 6), "per minute")
    print("Temperature after 40 minutes:", round(T(40), 2), "deg C")
    print("Time to cool to", Tq, "deg C:", round(math.log((T0 - Ts) / (Tq - Ts)) / k, 2), "minutes")
    times = [0, 10, 20, 30, 40, 60, 80, 100]
    temps = [round(T(t), 2) for t in times]
    print("Temperatures at", times, ":", temps)`,

  story:`The following table gives the variation of a periodic current over one period. Show that there is a constant part of 0.75 in the current, and obtain the amplitude of the first harmonic.

  model:`<p>For N equally spaced points over one period, the Fourier coefficients are</p>
   <p class="formula">a₀ = (2/N) Σ y, &nbsp;&nbsp; aₙ = (2/N) Σ y cos nx, &nbsp;&nbsp; bₙ = (2/N) Σ y sin nx</p>
   <p>The constant part is a₀/2 and the amplitude of the first harmonic is √(a₁² + b₁²). Python needs <code>math.cos</code>, <code>math.sin</code> with <code>math.radians</code>, and <code>math.hypot</code> for the amplitude.</p>`,
  params:[{k:'y',label:'y values at x = 0°, 60°, 120°, 180°, 240°, 300° (6 numbers)',def:'1.98, 1.30, 1.05, 1.30, -0.88, -0.25',list:true,count:6,min:-1000000,max:1000000}],
  code:v => `import math

x_deg = [0, 60, 120, 180, 240, 300]
y = [${v.y.join(', ')}]
N = len(y)
a0 = 2 * sum(y) / N

def a(n):
    return 2 * sum([y[i] * math.cos(n * math.radians(x_deg[i])) for i in range(N)]) / N

def b(n):
    return 2 * sum([y[i] * math.sin(n * math.radians(x_deg[i])) for i in range(N)]) / N

print("Constant part a0/2 =", round(a0 / 2, 4))
print("a1 =", round(a(1), 4), "  b1 =", round(b(1), 4))
print("a2 =", round(a(2), 4), "  b2 =", round(b(2), 4))
print("Amplitude of the first harmonic:", round(math.hypot(a(1), b(1)), 4))`,

    starter:`import math

`, hint:'h = (b - a) / n; total = f(a) + f(b); for i in range(1, n): weight 2 if i % 3 == 0 else 3; return 3 * h / 8 * total',
    sol:`import math

def simpson38(f, a, b, n):
    h = (b - a) / n
    total = f(a) + f(b)
    for i in range(1, n):
        if i % 3 == 0:
            total = total + 2 * f(a + i * h)
        else:

    return 3 * h / 8 * total

 intro:'Three longer problems. They are close to what you might set as an assignment for your own students. Use Trace my code to find mistakes.',

 practice:[
  { lv:'a', label:'Challenge 1 · Compare two root finders', task:`Define <code>bisection(f, a, b, tol)</code> and <code>newton(f, df, x0, tol)</code>. Each must return <b>two values</b>: the root and the number of iterations. Newton should stop when <code>math.isclose(x_new, x, abs_tol=tol)</code>. On x³ − x − 1 = 0, Newton needs far fewer iterations.`,
    starter:`import math
# Write your code below
`, hint:'bisection: count steps in the while loop and return (a + b) / 2, steps.  newton: loop forever, x_new = x - f(x) / df(x), steps += 1, if isclose: return x_new, steps',
    sol:`import math

def bisection(f, a, b, tol):
    steps = 0
    while b - a > tol:
        m = (a + b) / 2
        steps = steps + 1
        if f(a) * f(m) < 0:
            b = m
        else:
            a = m
    return (a + b) / 2, steps

def newton(f, df, x, tol):
    steps = 0
    while True:
        x_new = x - f(x) / df(x)
        steps = steps + 1
        if math.isclose(x_new, x, abs_tol=tol):
            return x_new, steps
        x = x_new

f = lambda x: x ** 3 - x - 1
df = lambda x: 3 * x ** 2 - 1

  { lv:'a', label:'Challenge 2 · Fit y = a e^(bx)', task:`Define <code>fit_exp(x, y)</code> that fits y = a e^(bx) by least squares on Y = ln y = ln a + bx, and returns <b>a and b</b>. (For the data x = 0…4, y = 1.5, 2.5, 3.5, 5.0, 7.5 this gives a ≈ 1.5799, b ≈ 0.3912.)`,
    starter:`import math
# Write your code below
`, hint:'Y = [math.log(v) for v in y]; fit a straight line Y = A + bx with the normal equations from Section 01; then return math.exp(A), b',
    sol:`import math

def fit_exp(x, y):
    n = len(x)
    Y = [math.log(v) for v in y]
    Sx = sum(x)
    SY = sum(Y)
    Sxx = sum([v * v for v in x])
    SxY = sum([x[i] * Y[i] for i in range(n)])
    b = (n * SxY - Sx * SY) / (n * Sxx - Sx ** 2)
    A = (SY - b * Sx) / n
    return math.exp(A), b

 m5: { s: {

 m6: { s: {

/* ================= reusable blocks ================= */
function texHTML(tex, display){
  if (window.katex){ try { return katex.renderToString(tex, { displayMode: display, throwOnError: false }); } catch(e){} }
  return `<code>${esc(tex)}</code>`;
}
const inlineMath = txt => String(txt).replace(/\$([^$]+)\$/g, (_, t) => texHTML(t, false));
function worked(m){
  if (!m) return '';
  if (typeof m === 'string') return `<p>${m}</p>`;
  const row = (label, html, cls = '') => `<div class="wsr ${cls}"><div class="wsl">${label}</div><div class="wsc">${html}</div></div>`;
  let h = '<div class="ws">';
  if (m.g) h += row('Given', inlineMath(m.g));
  if (m.f) h += row('Formula', texHTML(m.f, true));
  if (m.s && m.s.length) h += row('Working', texHTML('\\begin{aligned}' + m.s.join('\\\\') + '\\end{aligned}', true));
  if (m.a) h += row('Answer', `<span class="wsa">${texHTML(m.a, true)}</span>`, 'ans');
  if (m.n) h += `<div class="wsn">${inlineMath(m.n)}</div>`;
  return h + '</div>';
}
const taskLabel = (t, j) => t.label || ['Task A · Basic', 'Task B · Challenge', 'Task C · Extra practice'][j] || `Task ${j + 1}`;
function qnav(name, labels){
  return `<div class="qnav" data-q="${name}" role="tablist">${labels.map((t, j) => `<button data-j="${j}" role="tab"><span class="qn">${j + 1}</span><span class="qt">${t}</span></button>`).join('')}</div>`;
}
function codeBlock(el, code, id, after, fname){
  el._code = code;
  el.innerHTML = edShell(id, fname || 'example.py', code.split('\n').length + 1) + `
    <div class="row"><button class="pri" id="${id}Run">▶ Run</button><button id="${id}Tr">Trace step by step</button><button class="ghost" id="${id}Reset">Reset code</button><span class="kbd">Ctrl + Enter runs the code</span></div>
    <div class="out" id="${id}Out"></div><div class="trace" id="${id}Trace"></div>`;
  const $ = s => document.getElementById(id + s);
  $('Ed').value = code; makeEditor($('Ed'));
  $('Ed').addEventListener('run', () => $('Run').click());
  $('Run').onclick = async () => { $('Trace').innerHTML = ''; $('Out').innerHTML = '<span class="muted">Running…</span>'; const r = await runCode($('Ed').value).catch(() => NOPY); showRun($('Out'), r); if (after && !r.error) after(r); };
  $('Tr').onclick = () => { $('Out').innerHTML = ''; startTrace($('Trace'), $('Ed').value); };
  $('Reset').onclick = () => { setCode($('Ed'), el._code); $('Out').innerHTML = ''; $('Trace').innerHTML = ''; };
}
function predBlock(el, p, key, onOk){
  el.innerHTML = `<div style="margin-bottom:8px"><span class="lv ${p.lv}">${LV[p.lv]}</span></div>
    <pre class="cb">${esc(p.code)}</pre>
    <div class="opts">${p.opts.map(o => `<button data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div class="row"><button class="pri" data-a="chk">Check my answer</button><button data-a="run">Run it</button><button data-a="tr">Trace it</button><span class="err"></span></div>
    <div class="pres"></div><div class="out"></div><div class="trace"></div>`;
  highlight(el);
  const q = s => el.querySelector(s);
  let pick = null;
  el.querySelectorAll('.opts button').forEach(b => b.onclick = () => { pick = b.dataset.v; q('.err').textContent = ''; el.querySelectorAll('.opts button').forEach(x => x.classList.toggle('sel', x === b)); });
  q('[data-a=chk]').onclick = () => {
    if (pick === null){ q('.err').textContent = 'Choose an answer first.'; return; }
    const ok = pick === p.ans;
    q('.pres').innerHTML = `<div class="note ${ok ? 'k' : 'm'}"><b>${ok ? 'Correct.' : 'Not quite.'}</b> ${esc(p.why)}</div>`;
    if (ok){ prog[key] = 1; store.set(prog); onOk && onOk(); }
  };
  q('[data-a=run]').onclick = async () => { q('.trace').innerHTML = ''; showRun(q('.out'), await runCode(p.code).catch(() => NOPY)); };
  q('[data-a=tr]').onclick = () => { q('.out').innerHTML = ''; startTrace(q('.trace'), p.code); };
}
function taskBlock(el, l, t, j, onPass){
  const key = l.id + '_try' + j, ck = l.id + '_code' + j, id = 'tk' + j;
  el.innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span class="lv ${t.lv}">${taskLabel(t, j)}</span>${prog[key] ? '<span class="ok" style="font-size:.85em">✓ Solved</span>' : ''}</div>
    <div class="task">${t.task}</div>
    ${t.maths ? `<details class="mathbox"><summary>How to solve it in maths (worked by hand)</summary>${worked(t.maths)}</details>` : ''}
    ${edShell(id, 'my_solution.py', 9)}
    <div class="row"><button class="pri" id="${id}Chk">▶ Run and check</button><button id="${id}Tr">Trace my code</button><button id="${id}Hint">Hint</button><button class="ghost" id="${id}Sol">Show solution</button><button class="ghost" id="${id}Reset">Clear</button></div>
    <div id="${id}HintT"></div><div class="out" id="${id}Out"></div><div class="trace" id="${id}Trace"></div>`;
  const $ = s => document.getElementById(id + s);
  $('Ed').value = prog[ck] || t.starter; makeEditor($('Ed'));
  $('Ed').addEventListener('run', () => $('Chk').click());
  $('Ed').addEventListener('input', () => { prog[ck] = $('Ed').value; store.set(prog); });
  $('Chk').onclick = async () => {
    const code = $('Ed').value;
    $('Trace').innerHTML = ''; $('Out').innerHTML = '<span class="muted">Running…</span>';
    let r; try { r = await runCode(code); } catch(e){ $('Out').innerHTML = `<span class="bad">${NOPY.error}</span>`; return; }
    let h = '<span class="h">Output</span>' + (r.out ? esc(r.out) + (r.out.endsWith('\n') ? '' : '\n') : '<span class="muted">(nothing printed)</span>\n');
    if (r.error){ $('Out').innerHTML = h + `<span class="bad">${esc(r.error)}</span>\n<span class="muted">Fix the error and check again. "Trace my code" shows where it goes wrong.</span>`; return; }
    const res = await checkTests(t.tests);
    (t.must || []).forEach(([n, re]) => res.push([n, re.test(code)]));
    h += '\n<span class="h">Checks</span>';
    res.forEach(([n, ok]) => h += `<span class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}  ${esc(n)}</span>\n`);
    const pass = res.filter(x => x[1]).length;
    if (pass === res.length){ h += `\n<span class="ok"><b>All ${pass} checks passed. ${j === 0 ? 'Lesson complete.' : 'Challenge solved.'}</b></span>`; prog[key] = 1; store.set(prog); renderSide(); onPass && onPass(); }
    else h += `\n<span class="bad">${pass} of ${res.length} checks passed. Read the lines marked ✗, correct your code and check again.</span>`;
    $('Out').innerHTML = h;
  };
  $('Tr').onclick = () => { $('Out').innerHTML = ''; startTrace($('Trace'), $('Ed').value); };
  $('Hint').onclick = () => { $('HintT').innerHTML = `<div class="note d"><b>Hint.</b> ${esc(t.hint)}</div>`; };
  $('Sol').onclick = async () => { if (await ask('Show the solution?', 'Try it on your own first if you can. Your current code will be replaced by the solution.', 'Show solution', 'Keep trying')){ setCode($('Ed'), t.sol); prog[ck] = t.sol; store.set(prog); } };
  $('Reset').onclick = async () => { if (await ask('Clear your code?', 'This removes what you have written for this task and restores the starting code.', 'Clear', 'Cancel')){ setCode($('Ed'), t.starter); prog[ck] = ''; store.set(prog); $('Out').innerHTML = ''; $('Trace').innerHTML = ''; $('HintT').innerHTML = ''; } };
}

function openMath(h, title, kind){
  if (!h) return;
  let p = document.getElementById('mhPanel');
  if (!p){
    document.body.insertAdjacentHTML('beforeend', '<div class="mh-scrim" id="mhScrim"></div><aside class="mh-panel" id="mhPanel" role="dialog" aria-modal="true" aria-labelledby="mhT"></aside>');
    p = document.getElementById('mhPanel');
    document.getElementById('mhScrim').onclick = closeMath;
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('mh-open')) closeMath(); });
  }
  const sec = (n, t, body) => `<section class="mh-sec"><h4><span>${n}</span>${t}</h4>${body}</section>`;
  let body;
  if (kind === 'learn'){
    body = sec(1, 'In simple words', `<div class="mh-say">${h.say}</div>`)
      + (h.pic ? sec(2, 'Picture it', h.pic) : '')
      + sec(h.pic ? 3 : 2, 'Example', `<div class="mh-eg">${h.eg}</div>`);
  } else if (h.formulas){
    const tex = t => texHTML(t, true);
    body = sec(1, 'The problem', `<div class="mh-say">${h.problem}</div>`)
      + sec(2, h.formulas.length > 1 ? 'The formulas' : 'The formula', h.formulas.map(([t, w]) => `<div class="mh-f">${tex(t)}<div class="mh-w">${w}</div></div>`).join(''))
      + sec(3, 'What each letter means', `<table class="mh-sym"><tr><th>Letter</th><th>What it means</th><th>In this example</th><th>In the code</th></tr>${h.symbols.map(([a, b, c, d]) => `<tr><td class="mh-l">${a}</td><td>${b}</td><td>${c || '—'}</td><td>${d ? `<code>${d}</code>` : '—'}</td></tr>`).join('')}</table>`)
      + sec(4, 'Solve it step by step', `<ol class="mh-solve">${h.steps.map(([w, t]) => `<li><div class="mh-st">${w}</div><div class="mh-sm">${tex(t)}</div></li>`).join('')}</ol>`)
      + sec(5, 'Answer', `<div class="mh-ans">${h.answer}</div>${h.prints ? `<div class="mh-pr"><span>Python prints</span><code>${h.prints}</code></div>` : ''}`);
  } else {
    body = sec(1, 'What this program does', `<div class="mh-say">${h.does}</div>`)
      + sec(2, 'Every variable, in plain words', `<table class="mh-vars">${h.vars.map(([a, b]) => `<tr><td><code>${a}</code></td><td>${b}</td></tr>`).join('')}</table>`)
      + sec(3, 'The maths, step by step', `<ol class="mh-steps">${h.steps.map(([m, w]) => `<li><div class="mh-m">${m}</div>${w ? `<div class="mh-w">${w}</div>` : ''}</li>`).join('')}</ol>`)
      + sec(4, 'Answer', `<div class="mh-ans">${h.answer}</div>`);
  }
  p.innerHTML = `<div class="mh-head"><div><div class="mh-kick">Explain the maths${kind === 'run' ? ' · step by step' : ''}</div><h3 id="mhT">${title}</h3></div><button class="mh-x" aria-label="Close" onclick="closeMath()">×</button></div>${body}`;
  p.scrollTop = 0;
  document.body.classList.add('mh-open');
  p.querySelector('.mh-x').focus();
}

  ['run', 'pred', 'try', 'real'].forEach(n => pickQ(n, 0));
  l.predict.forEach((p, j) => predBlock($('pr' + j), p, l.id + '_pred' + j, marks));
  l.tryit.forEach((t, j) => taskBlock($('ta' + j), l, t, j, marks));
  codeBlock($('mBlock'), l.maths.app.code, 'mx');

  if (l.real){
    const R = l.real;
    const readP = () => {
      const v = {}; let err = '';
      R.params.forEach(f => {
        const raw = $('rwF').querySelector(`[data-k="${f.k}"]`).value.trim(), x = Number(raw);
        if (f.list){
          const a = raw.split(/[,\s]+/).filter(Boolean).map(Number);
          if (!a.length || a.some(isNaN)) err = `${f.label}: enter numbers separated by commas.`;
          else if (f.count && a.length !== f.count) err = `${f.label}: enter exactly ${f.count} numbers (you entered ${a.length}).`;
          else if (a.length < (f.minCount || 1) || a.length > (f.maxCount || 500)) err = `${f.label}: enter between ${f.minCount || 1} and ${f.maxCount || 500} numbers.`;
          else if (f.odd && a.length % 2 === 0) err = `${f.label}: Simpson's 1/3 rule needs an even number of strips, so enter an odd number of values (you entered ${a.length}).`;
          else if (a.some(y => y < f.min || y > f.max)) err = `${f.label}: every value must be from ${f.min} to ${f.max}.`;
          else if (f.int && a.some(y => !Number.isInteger(y))) err = `${f.label}: enter whole numbers only.`;
          else if (f.distinct && new Set(a).size !== a.length) err = `${f.label}: every value must be different (a repeated x would divide by zero).`;
          else if (f.equal && a.some((y, k) => k > 0 && Math.abs((y - a[k-1]) - (a[1] - a[0])) > 1e-9 * Math.max(1, Math.abs(a[1] - a[0])))) err = `${f.label}: the values must be equally spaced (constant h).`;
          else if (f.equal && a[1] === a[0]) err = `${f.label}: the spacing h cannot be zero.`;
          else v[f.k] = a;
          return;
        }
        if (raw === '' || isNaN(x)) err = `${f.label}: enter a number.`;
        else if (x < f.min || x > f.max) err = `${f.label}: enter a value from ${f.min} to ${f.max}.`;
        else if (f.int && !Number.isInteger(x)) err = `${f.label}: enter a whole number.`;
        else if (f.even && x % 2 !== 0) err = `${f.label}: enter an even number.`;
        else v[f.k] = x;
      });
      if (!err) R.params.forEach(f => { if (f.same && v[f.k] && v[f.same] && v[f.k].length !== v[f.same].length) err = `${f.label}: you entered ${v[f.k].length} values but there are ${v[f.same].length} values above. Each pair is one observation, so the counts must match.`; });
      $('rwErr').textContent = err;
      return err ? null : v;
    };
    const drawChart = async () => {
      if (!R.chart) return;
      try {
        const p = await getPy();
        const C = R.chart, nm = x => JSON.stringify(x || '');
        let [lst, labs, base] = JSON.parse(p.runPython(`json.dumps([_G.get(${nm(C.list)}), _G.get(${nm(C.labels)}), _G.get(${nm(C.base)})])`));
        if (!Array.isArray(lst) || !lst.length || lst.some(v => typeof v !== 'number')){ $('rwChart').innerHTML = ''; return; }
        if (typeof base !== 'number' || base <= 0) base = Math.max(...lst.map(Math.abs)) || 1;
        if (!Array.isArray(labs) || labs.length !== lst.length) labs = null;
        const fmtv = v => (C.pre || '') + Number(Math.abs(v) < 0.5 * Math.pow(10, -(C.dp || 0)) ? 0 : v).toLocaleString('en-IN', {minimumFractionDigits:C.dp || 0, maximumFractionDigits:C.dp || 0}) + (C.suf || '');
        const step = Math.ceil(lst.length / 36), st = C.start === undefined ? 1 : C.start;
        const show = lst.map((v, k) => [v, k]).filter(([, k]) => step === 1 || k % step === 0 || k === lst.length - 1);
        $('rwChart').innerHTML = `<div class="tlab">${C.label}</div>` + show.map(([v, k]) => `<div class="cr"><span class="muted">${esc(labs ? (C.lpre || '') + labs[k] + (C.lsuf || '') : (C.row || 'Item') + ' ' + (k + st))}</span><span><i style="width:0" data-w="${Math.max(0, Math.min(100, v / base * 100))}"></i></span><span>${fmtv(v)}</span></div>`).join('');
        requestAnimationFrame(() => requestAnimationFrame(() => $('rwChart').querySelectorAll('i').forEach(b => b.style.width = b.dataset.w + '%')));
      } catch(e){ $('rwChart').innerHTML = ''; }
    };
    const v0 = readP();
    codeBlock($('rwBlock'), R.code(v0), 'rw', drawChart, 'solution.py');
    $('rwF').querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
      const v = readP(); if (!v) return;
      const c = R.code(v); setCode($('rwEd'), c); $('rwBlock')._code = c;
      $('rwOut').innerHTML = ''; $('rwTrace').innerHTML = ''; $('rwChart').innerHTML = '';
    }));
  }

  if (cur > 0) $('prevL').onclick = () => go(cur - 1);
  showTab(tab);
}

/* Printable teacher's guide: open index.html?guide, then print to PDF. Written to be read before class. */
function guideComment(code, symbols){
  const keys = [];
  symbols.forEach(([a, b, c, d]) => { if (d && d !== '—') d.split(/,\s*/).forEach(k => { k = k.trim(); if (k.length >= 1) keys.push([k, b]); }); });
  const short = s => { s = s.replace(/<[^>]+>/g, ''); return s.length > 38 ? s.slice(0, 38).replace(/\s+\S*$/, '') + '…' : s; };
  const lines = code.split('\n');
  const notes = lines.map(line => {
    const t = line.trim();
    if (!t || t.includes('#')) return '';
    if (/^import math$/.test(t)) return 'open the maths toolbox';
    const asg = t.match(/^([A-Za-z_][\w]*(?:\s*,\s*[A-Za-z_]\w*)*)\s*=(?!=)/);
    if (asg){ const names = asg[1].split(/\s*,\s*/); const hit = keys.find(([k]) => names.includes(k)); if (hit) return short(hit[1]); }
    const hit = keys.filter(([k]) => k.length >= 3 && t.includes(k)).sort((x, y) => y[0].length - x[0].length)[0];
    if (hit) return short(hit[1]);
    if (/^print\(/.test(t)) return 'show the result';
    return '';
  });
  const w = Math.min(46, Math.max(...lines.map(l => l.length)) + 3);
  return lines.map((l, i) => esc(l) + (notes[i] ? ' '.repeat(Math.max(2, w - l.length)) + `<span class="gc"># ${esc(notes[i])}</span>` : '')).join('\n');
}
function guideCode(code, title){
  const c = MHCOM[title] || {};
  const lines = code.split('\n');
  const w = Math.min(44, Math.max(...lines.map(l => l.length)) + 3);
  return lines.map(l => { const n = c[l.trim()]; return esc(l) + (n ? ' '.repeat(Math.max(2, w - l.length)) + `<span class="gc"># ${esc(n)}</span>` : ''); }).join('\n');
}
