/* ================= day summary ================= */
function myCode(){
  const parts = [];
  SECTIONS.forEach(sec => sec.lessons.forEach((l, k) => {
    const tasks = l.practice || l.tryit;
    tasks.forEach((t, j) => {
      const code = (prog[l.id + '_code' + j] || '').trim();
      if (!code || code === (t.starter || '').trim()) return;
      const name = t.label || (j === 0 ? 'Task A' : 'Task B');
      parts.push({ head:`Section ${sec.num} · ${sec.title} · ${l.practice ? '' : 'Lesson ' + (k + 1) + ': '}${l.title} · ${name}`, solved: !!prog[l.id + '_try' + j], code });
    });
  }));
  return parts;
}
function download(name, text, type){
  try {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch(e){}
}
function renderSummary(){
  const m = document.getElementById('main');
  let total = 0, solved = 0;
  const rows = SECTIONS.map(sec => {
    const tasks = sec.lessons.reduce((n, l) => n + (l.practice || l.tryit).length, 0);
    const ok = sec.lessons.reduce((n, l) => n + (l.practice || l.tryit).filter((_, j) => prog[l.id + '_try' + j]).length, 0);
    total += tasks; solved += ok;
    const done = sec.lessons.filter(lessonDone).length;
    return `<tr><td><b>${sec.num}</b> · ${sec.title}</td><td>${done} / ${sec.lessons.length}</td><td>${ok} / ${tasks}</td><td>${prog[sec.qkey] ? '<span class="ok">✓ Passed</span>' : '<span class="muted">Not yet</span>'}</td></tr>`;
  }).join('');
  const parts = myCode();
  m.innerHTML = `<div class="crumb">Day 3 / Summary</div><h1 class="lt">Day 3 summary</h1>
  <p class="ls">Lists, functions and the math module: what you have completed in this browser.</p>
  <div class="card"><h3>Your progress</h3>
    <div class="bar" style="height:8px;margin:10px 0 6px;background:var(--soft)"><div style="height:8px;width:${total ? Math.round(solved / total * 100) : 0}%"></div></div>
    <p class="intro" style="margin-bottom:12px">${solved} of ${total} problems solved</p>
    <table class="t"><tr><th>Section</th><th>Completed</th><th>Problems solved</th><th>Quiz</th></tr>${rows}</table></div>
  <div class="card"><h3>Download your Day 3 notebook</h3>
    <p class="intro">Everything you wrote in "Try it yourself" and the practice sets, ${parts.length} pieces of code in all, collected into one file. The notebook opens in Google Colab or Jupyter, ready to use in your own classes.</p>
    <div class="row"><button class="pri" id="dlNb">Download Colab notebook (.ipynb)</button><button id="dlPy">Download Python file (.py)</button></div>
    <div class="err" id="dlErr"></div></div>
  <div class="card"><h3>What comes next</h3><p style="margin:0"><b>Day 4 · NumPy arrays, matrices and graphs.</b> The lists of numbers from today become NumPy arrays, the 3 × 3 systems become one-line matrix solutions, and every table of values becomes a graph.</p></div>
  <div class="card"><h3>Start again</h3><p class="intro">Clear all progress and saved code in this browser, for example before a new batch of participants uses this computer.</p><button id="reset">Clear all progress</button></div>
  <div class="foot"><button class="ghost" id="prevL">◀ ${pageTitle(PAGES[cur-1])}</button><span></span></div>`;
  const need = () => { if (!parts.length){ document.getElementById('dlErr').textContent = 'Nothing to download yet. Write some code in a "Try it yourself" task or a practice set first.'; return false; } return true; };
  document.getElementById('dlPy').onclick = () => {
    if (!need()) return;
    const txt = '# Day 3: Lists, Functions and the math Module\n# Python for Mathematics Faculty, my solutions\n\n' +
      parts.map(p => `# ${'='.repeat(70)}\n# ${p.head}${p.solved ? '  (all checks passed)' : ''}\n# ${'='.repeat(70)}\n${p.code}\n`).join('\n');
    download('day3_my_solutions.py', txt, 'text/x-python');
  };
  document.getElementById('dlNb').onclick = () => {
    if (!need()) return;
    const lines = t => t.split('\n').map((x, i, a) => i < a.length - 1 ? x + '\n' : x);
    const cells = [{ cell_type:'markdown', metadata:{}, source:lines('# Day 3: Lists, Functions and the math Module\nPython for Mathematics Faculty. My solutions from the interactive workbook.') }];
    parts.forEach(p => {
      cells.push({ cell_type:'markdown', metadata:{}, source:lines(`### ${p.head}${p.solved ? ' ✓' : ''}`) });
      cells.push({ cell_type:'code', execution_count:null, metadata:{}, outputs:[], source:lines(p.code) });
    });
    const nb = { cells, metadata:{ kernelspec:{ display_name:'Python 3', language:'python', name:'python3' }, language_info:{ name:'python' } }, nbformat:4, nbformat_minor:4 };
    download('day3_my_solutions.ipynb', JSON.stringify(nb, null, 1), 'application/x-ipynb+json');
  };
  document.getElementById('reset').onclick = async () => {
    if (!await ask('Clear all progress?', 'This removes every tick, quiz result and saved piece of code from this browser. It cannot be undone.', 'Clear everything', 'Cancel')) return;
    prog = {}; store.set(prog); renderSide(); renderSummary();
  };
  document.getElementById('prevL').onclick = () => go(cur - 1);
}
